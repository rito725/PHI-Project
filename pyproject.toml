[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-gov"
version = "0.1.0"
description = "HIPAA-aware PHI discovery agent and guarded NL-to-SQL analytics on BigQuery"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.4",
  "db-dtypes>=1.3",
  "duckdb>=2.0",
  "faker>=40",
  "google-cloud-bigquery>=3.40",
  "google-cloud-datacatalog>=3.30",
  "google-cloud-dlp>=3.40",
  "langgraph>=1.2",
  "numpy",
  "pandas>=3.0",
  "pyarrow",
  "pydantic>=2.10",
  "sqlglot>=30",
  "streamlit>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
phi-gov = "phi_gov.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
